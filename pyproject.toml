# Author: André Henrique (@mrhenrike) | https://github.com/mrhenrike

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adxpl-forge"
version = "2.1.0"
description = "ADXPL-Forge (AXF) — Active Directory attack and audit framework with 219 modules across 25 categories. Enumeration, Kerberos, ADCS, lateral movement, credential theft, coercion, relay, ACL abuse, trust attacks, privilege escalation, kernel exploits, CVE exploits, LOLBins, evasion, BYOVD, emulation, and more."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [
    { name = "André Henrique", email = "henrique.santos@uniaogeek.com.br" },
]
maintainers = [
    { name = "André Henrique", email = "henrique.santos@uniaogeek.com.br" },
]
keywords = [
    "security", "pentesting", "active-directory", "ad-security", "red-team",
    "bloodhound", "kerberoasting", "as-rep-roasting", "adcs", "certipy",
    "dcsync", "ntlm-relay", "pass-the-hash", "golden-ticket", "silver-ticket",
    "exploit", "cve", "mitre-attack", "xpl-forge", "lateral-movement",
    "privilege-escalation", "credential-theft", "coercion", "relay-attack",
    "acl-abuse", "trust-attack", "lolbins", "evasion", "byovd",
    "kernel-exploit", "purple-team", "emulation", "sccm", "exchange",
    "azure-ad", "impacket",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
requires-python = ">=3.9"
dependencies = [
    "impacket>=0.12.0",
    "ldap3>=2.9",
    "requests>=2.31.0,<3.0",
    "rich>=13.0",
    "dnspython>=2.4",
    "xpl-core>=0.1.0",
]

[project.optional-dependencies]
bloodhound = [
    "bloodhound>=1.7",
    "neo4j>=5.0",
]
certipy = [
    "certipy-ad>=4.8",
]
relay = [
    "pycryptodome>=3.20",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "bandit>=1.7",
    "build>=1.0",
]
full = [
    "bloodhound>=1.7",
    "neo4j>=5.0",
    "certipy-ad>=4.8",
    "pycryptodome>=3.20",
]

[project.urls]
Homepage      = "https://github.com/mrhenrike/ADXPL-Forge"
Repository    = "https://github.com/mrhenrike/ADXPL-Forge"
Documentation = "https://github.com/mrhenrike/ADXPL-Forge/wiki"
"Bug Tracker" = "https://github.com/mrhenrike/ADXPL-Forge/issues"

[project.scripts]
axf   = "adxpl.__main__:main"
adxpl = "adxpl.__main__:main"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
where   = ["."]
include = ["adxpl*"]

[tool.setuptools.package-data]
"adxpl.resources" = ["*.json", "*.yaml"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "impacket.*",
    "ldap3.*",
    "requests.*",
    "rich.*",
    "dns.*",
    "bloodhound.*",
    "neo4j.*",
    "certipy.*",
    "Cryptodome.*",
    "xpl_core.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = []

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "RUF"]
ignore = [
    "E101",
    "E501",
    "E701",
    "E702",
    "E703",
    "E711",
    "E712",
    "E721",
    "E722",
    "E741",
    "W191",
    "W291",
    "W292",
    "W293",
    "F403",
    "F405",
    "B007",
    "B008",
    "B023",
    "B028",
    "B904",
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM110",
    "SIM113",
    "SIM114",
    "SIM115",
    "SIM117",
    "SIM210",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF005",
    "RUF012",
    "RUF013",
    "RUF015",
    "RUF046",
    "RUF059",
]

[tool.ruff.lint.per-file-ignores]
"adxpl/modules/**" = ["F401", "F404", "F523", "F524", "F601", "F811", "F821", "F841", "F842", "E402", "E731", "I001", "B006", "B012", "B018", "B026", "SIM101", "SIM112", "SIM116", "SIM118", "SIM201", "SIM211", "SIM212", "RUF034"]
"adxpl/core/**" = ["F401", "F601", "F821", "F841", "E402", "I001", "B005", "B006", "B012", "SIM101", "SIM112", "SIM118", "SIM201", "SIM212"]
"adxpl/tools/**" = ["F401", "F821", "F841", "E402", "B005", "SIM201"]
"adxpl/__main__.py" = ["E402"]
"tests/**" = ["F841", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["adxpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
